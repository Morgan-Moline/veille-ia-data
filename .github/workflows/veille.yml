
name: Actualisation de la veille

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les actualites
        env:
          GEMINI_API_KEY: ${{ secrets.VEILLE_IA }}
        run: python scripts/veille.py
      
      - name: Enregistrer les actualites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Mise a jour automatique de la veille"
          git push
